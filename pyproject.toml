[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unsupervised-patterns"
version = "0.1.0"
description = "Clean, mathematical reference implementations of unsupervised feature extraction: PCA (SVD & Eigendecomposition), K-Means++, Gaussian Mixture Models (EM), DBSCAN, and cluster validation metrics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gabriel", email = "gabriel@example.com" }
]
keywords = [
    "unsupervised-learning",
    "pca",
    "svd",
    "k-means",
    "gaussian-mixture-models",
    "dbscan",
    "silhouette-score",
    "expectation-maximization"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
pythonpath = ["src"]
